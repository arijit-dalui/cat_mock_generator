name: Pool warm

# Keeps the generated-set pool full so users are always served pre-made sets.
#
# Why a self-loop instead of `cron: "*/5"`? GitHub's scheduled `schedule`
# trigger is best-effort and HEAVILY throttles high-frequency crons — in
# practice "*/5" fired only ~once an hour here. So instead, GitHub only has to
# start a run occasionally, and EACH run loops internally: it hits the topup
# endpoint every 5 minutes for ~an hour. A timeout or Groq rate-limit on any
# single tick is swallowed (logged, never fatal) so the loop keeps going and
# the queue keeps filling every 5 minutes no matter what.
#
# Required repo secrets:
#   APP_URL      - production base URL, e.g. https://cat-mocks-assss-projects.vercel.app
#   WORKER_TOKEN - same value as CRON_SECRET / WORKER_TOKEN in Vercel env

on:
  schedule:
    # Start a fresh looping run every 15 min. GitHub may delay/drop some of
    # these, but each run covers ~55 min on its own, so coverage is continuous.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Pool depth to maintain per section"
        default: "50"
      minutes:
        description: "How long this run keeps warming (minutes)"
        default: "330"
      max:
        description: "Sets generated per 5-minute tick"
        default: "3"

concurrency:
  group: pool-warm
  # Let a long-running loop finish rather than churn-restarting it every fire;
  # overlapping scheduled fires are skipped while one run is active.
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    # Each run self-loops for ~5.5h (public repo = unlimited Actions minutes),
    # so a single run keeps filling every 5 min for hours. GitHub's sparse
    # scheduling then only has to start a fresh run occasionally — NOT every
    # 5 min. Expect FEW runs in the Actions tab by design; judge progress by
    # pool depth, not run count.
    timeout-minutes: 340
    steps:
      - name: Warm the pool every 5 minutes (self-looping)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          TARGET: ${{ github.event.inputs.target || '50' }}
          MINUTES: ${{ github.event.inputs.minutes || '55' }}
          MAXPER: ${{ github.event.inputs.max || '3' }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ] || [ -z "${WORKER_TOKEN:-}" ]; then
            echo "APP_URL and WORKER_TOKEN secrets must be set"; exit 1
          fi
          URL="${APP_URL%/}/api/internal/cron-topup?target=${TARGET}&max=${MAXPER}&sections=VA,RC,DI,LR,QA"
          END=$(( $(date +%s) + MINUTES * 60 ))
          tick=0
          while :; do
            tick=$((tick + 1))
            start=$(date +%s)
            echo "===== tick #${tick} @ $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
            # Best-effort: a timeout / 429 / 5xx must NEVER stop the loop.
            code=$(curl -sS -m 285 -o /tmp/resp.json -w "%{http_code}" \
              -X POST "$URL" -H "Authorization: Bearer ${WORKER_TOKEN}" || echo "000")
            echo "HTTP ${code}"
            head -c 800 /tmp/resp.json 2>/dev/null || true
            echo
            now=$(date +%s)
            if [ "$now" -ge "$END" ]; then
              echo "Warm window (${MINUTES}m) complete after ${tick} ticks."
              break
            fi
            # Keep a ~5-minute cadence regardless of how long the call took.
            elapsed=$((now - start))
            sleep_for=$((300 - elapsed))
            if [ "$sleep_for" -lt 10 ]; then sleep_for=10; fi
            echo "next tick in ${sleep_for}s"
            sleep "$sleep_for"
          done
          # Always succeed. Rate limits / timeouts are expected and must not
          # mark the workflow failed or interrupt the schedule.
          exit 0
