<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 720" font-family="Arial, Helvetica, sans-serif"><rect width="798" height="720" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Solution — the order was the standings</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">A 5/2/1 podium race whose presentation order regenerates from the table it conceals.</text><rect x="20" y="72" width="26" height="78" fill="#e2e8f0" stroke="#e2e8f0"/><text x="33.0" y="116.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">#</text><rect x="46" y="72" width="180" height="78" fill="#e2e8f0" stroke="#e2e8f0"/><text x="136.0" y="116.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Move</text><rect x="226" y="72" width="552" height="78" fill="#e2e8f0" stroke="#e2e8f0"/><text x="502.0" y="116.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Why it is forced</text><rect x="20" y="150" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="194.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">1</text><rect x="46" y="150" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="186.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">The order IS the</text><text x="136.0" y="201.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">standings</text><rect x="226" y="150" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="186.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Advika last in R2-R4 = strict leader after R1, R2, R3 (a tie sends her</text><text x="502.0" y="201.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">earlier, alphabet first) - so she won Round 1</text><rect x="20" y="228" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="272.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">2</text><rect x="46" y="228" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="272.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">The gap argument</text><rect x="226" y="228" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="257.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">R3's fourth presenter = the R2 runner-up, who won R3's five; Advika still led</text><text x="502.0" y="272.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">after R3, so her R2 lead exceeded 3 - only a second win allows that: 10 at the</text><text x="502.0" y="287.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">checkpoint</text><rect x="20" y="306" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="350.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">3</text><rect x="46" y="306" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="342.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Conservation, then Dev's</text><text x="136.0" y="357.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">cap</text><rect x="226" y="306" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="342.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">the R2 column sums to 16: Bhaskar + Dev = 3; Dev's printed final 1 caps him -</text><text x="502.0" y="357.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">the splits 2/1 and 3/0 both survive this step</text><rect x="20" y="384" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="428.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">4</text><rect x="46" y="384" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="420.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Fact 5 kills the 3/0</text><text x="136.0" y="435.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">split</text><rect x="226" y="384" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="413.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">on 3/0 Bhaskar's two scores are spent, Charvi wins R3, Esha goes 1-then-5,</text><text x="502.0" y="428.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">R3's 2 falls to Advika - and the R4 order then repeats R3's exactly: all FIVE</text><text x="502.0" y="443.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">keep position, against fact 5's 'exactly three'. So 2/1</text><rect x="20" y="462" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="506.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">5</text><rect x="46" y="462" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="506.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">The concealed winner</text><rect x="226" y="462" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="491.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">R3 order E D B C A puts Charvi fourth: fact 3 crowns her; Bhaskar's 2 is R1's</text><text x="502.0" y="506.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">second place (two 1s starve Charvi's 3; an R2 second place would put him first</text><text x="502.0" y="521.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">in R2's order, against fact 2)</text><rect x="20" y="540" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="584.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">6</text><rect x="46" y="540" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="584.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">The finish</text><rect x="226" y="540" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="569.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Dev and Esha swap places into R4 (tie at 1, alphabet first) - fact 5's three</text><text x="502.0" y="584.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">keepers; Charvi presents fourth and scores (fact 4); four reconstructions: A</text><text x="502.0" y="599.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">11/12, B 3/4, C 9/10, coupled</text><rect x="20" y="618" width="26" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="33.0" y="662.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">7</text><rect x="46" y="618" width="180" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="136.0" y="662.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">The keys</text><rect x="226" y="618" width="552" height="78" fill="#ffffff" stroke="#e2e8f0"/><text x="502.0" y="662.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Q1 10 (D) - Q2 Charvi (B) - Q3 4 (B) - Q4 Charvi-on-9 (C)</text></svg>