<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" font-family="Arial, Helvetica, sans-serif"><rect width="430" height="300" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">The Karlow day-book</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Prices: whole numbers of rings, unknown;</text><text x="20" y="68" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">all swaps in whole pieces, both ways.</text><rect x="20" y="88" width="60" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="50.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Entry</text><rect x="80" y="88" width="330" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="245.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">What the day-book says</text><rect x="20" y="122" width="60" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="50.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">1</text><rect x="80" y="122" width="330" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="245.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">7 salt bars  ->  30 rings + 12 bead-strings</text><rect x="20" y="156" width="60" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="50.0" y="178.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">2</text><rect x="80" y="156" width="330" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="245.0" y="178.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">a salt bar trades above a dozen rings</text><rect x="20" y="190" width="60" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="50.0" y="212.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">3</text><rect x="80" y="190" width="330" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="245.0" y="212.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">100 rings, to the last ring, on bars and</text><rect x="20" y="224" width="60" height="34" fill="#ffffff" stroke="#e2e8f0"/><rect x="80" y="224" width="330" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="245.0" y="246.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">strings - at least one of each (Odo)</text><text x="20" y="278" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Rings are the base medium.</text></svg>