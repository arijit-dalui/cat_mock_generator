<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 352" font-family="Arial, Helvetica, sans-serif"><rect width="548" height="352" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">New enrolments, in tens (the season register)</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Every monthly figure is a whole number from 1 to 9.</text><text x="20" y="68" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Blank cells were never entered.</text><rect x="20" y="88" width="112" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="76.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Centre</text><rect x="132" y="88" width="74" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="169.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">January</text><rect x="206" y="88" width="80" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="246.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">February</text><rect x="286" y="88" width="68" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="320.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">March</text><rect x="354" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="386.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">April</text><rect x="418" y="88" width="110" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="473.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Lowest month</text><rect x="20" y="122" width="112" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="76.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Ashoka</text><rect x="132" y="122" width="74" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="169.0" y="144.0" font-size="12"