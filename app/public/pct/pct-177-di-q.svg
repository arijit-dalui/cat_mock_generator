<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="368" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">The booking sheet — as it survives</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">40 seats; legs 1 and 3 sold out, leg 2 did not.</text><text x="20" y="68" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Takings 5,190; exactly two fares under 6 tickets.</text><rect x="20" y="88" width="110" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="75.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Fare</text><rect x="130" y="88" width="60" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="160.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Legs</text><rect x="190" y="88" width="70" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="225.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Price</text><rect x="260" y="88" width="80" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="300.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Tickets</text><rect x="20" y="122" width="110" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="75.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Dhara-Ekli</text><rect x="130" y="122" width="60" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="160.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">1</text><rect x="190" y="122" width="70" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="225.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">50</text><rect x="260" y="122" width="80" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="300.0" y="144.0" font-size="12" fill="#