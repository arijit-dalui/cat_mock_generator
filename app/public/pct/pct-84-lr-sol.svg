 stroke="currentColor" stroke-width="1"/><text x="482.8" y="103.8" fill="currentColor" font-size="11" text-anchor="middle">adjacent permutations = Fibonacci F(7)</text><rect x="0.0" y="115.0" width="262.7" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="131.3" y="133.8" fill="currentColor" font-size="11" text-anchor="middle">Q3: &lt;=2 out of place (7 presses)</text><rect x="262.7" y="115.0" width="58.1" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="291.8" y="133.8" fill="currentColor" font-size="11" text-anchor="middle">21</text><rect x="320.8" y="115.0" width="324.1" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="482.8" y="133.8" fill="currentColor" font-size="11" text-anchor="middle">identity (1) + swaps C(7,2)-1=20</text><rect x="0.0" y="145.0" width="262.7" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="131.3" y="163.8" fill="currentColor" font-size="11" text-anchor="middle">Q4: within one place, 1-2-3-3-4-5-6</text><rect x="262.7" y="145.0" width="58.1" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="291.8" y="163.8" fill="currentColor" font-size="11" text-anchor="middle">15</text><rect x="320.8" y="145.0" width="324.1" height="30" fill="none" stroke="currentColor" stroke-width="1"/><text x="482.8" y="163.8" fill="currentColor" font-size="11" text-anchor="middle">21 position-moves, 6 collapse (adjacent 3,3)</text></svg>