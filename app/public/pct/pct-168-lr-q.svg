<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="Arial, Helvetica, sans-serif"><rect width="360" height="302" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Money left at the close</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Each collector began with 100 rupees.</text><rect x="20" y="72" width="160" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="100.0" y="94.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Collector</text><rect x="180" y="72" width="160" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="260.0" y="94.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Amount (rupees)</text><rect x="20" y="106" width="160" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="100.0" y="128.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Omar</text><rect x="180" y="106" width="160" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="20" y="140" width="160" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="100.0" y="162.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Puja</text><rect x="180" y="140" width="160" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="260.0" y="162.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">50</text><rect x="20" y="174" width="160" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="100.0" y="196.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Rehan</text><rect x="180" y="174" width="160" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="20" y="208" width="160" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="100.0" y="230.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Sana</text><rect x="180" y="208" width="160" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><text x="20" y="262" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Blank cells are withheld (not published);</text><text x="20" y="280" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">a blank tells you nothing about the amount.</text></svg>