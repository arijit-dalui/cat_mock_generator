<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 318" font-family="Arial, Helvetica, sans-serif"><rect width="630" height="318" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Plates sold (the surviving tally sheet)</text><text x="20" y="52" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Figures are whole numbers 3-12.</text><text x="20" y="68" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Blank cells were not recorded.</text><rect x="20" y="88" width="100" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="70.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Cart</text><rect x="120" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="152.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Fri 1</text><rect x="184" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="216.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Fri 2</text><rect x="248" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="280.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Fri 3</text><rect x="312" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="344.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Fri 4</text><rect x="376" y="88" width="64" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="408.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Total</text><rect x="440" y="88" width="170" height="34" fill="#e2e8f0" stroke="#e2e8f0"/><text x="525.0" y="110.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Note</text><rect x="20" y="122" width="100" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="70.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Momos</text><rect x="120" y="122" width="64" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="152.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">5</text><rect x="184" y="122" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="248" y="122" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="312" y="122" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="376" y="122" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="440" y="122" width="170" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="525.0" y="144.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">more each Friday</text><rect x="20" y="156" width="100" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="70.0" y="178.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Noodles</text><rect x="120" y="156" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="184" y="156" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="248" y="156" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="312" y="156" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="376" y="156" width="64" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="408.0" y="178.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">28</text><rect x="440" y="156" width="170" height="34" fill="#e0f2fe" stroke="#e2e8f0"/><text x="525.0" y="178.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">fewer each Friday</text><rect x="20" y="190" width="100" height="34" fill="#ffffff" stroke="#e2e8f0"/><text x="70.0" y="212.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Pav Bhaji</text><rect x="120" y="190" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="184" y="190" width="64" height="34" fill="#f1f5f9" stroke="#e2e8f0"/><rect x="248" y="190" width="64" height="34" f